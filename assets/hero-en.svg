<svg xmlns="http://www.w3.org/2000/svg" width="580" height="430" viewBox="0 0 580 430" fill="none" role="img" aria-labelledby="title desc">
<title id="title">From scattered notes to a clear result</title><desc id="desc">Notes, an illustrated conversation and an email show how to provide material, explain a task and check the result. Not a product screenshot.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c9d1be"/></pattern><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#283f2e" flood-opacity=".07"/></filter></defs>
<rect x="16" y="20" width="548" height="389" rx="34" fill="#e9edde"/><rect x="16" y="20" width="548" height="389" rx="34" fill="url(#dots)"/>
<circle cx="474" cy="90" r="39" fill="#d3e8a8"/><path d="M474 69v42M453 90h42M460 76l28 28M460 104l28-28" stroke="#536b39" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(52 54) rotate(-8 95 80)" filter="url(#shadow)"><rect width="181" height="157" rx="9" fill="#fff3cf" stroke="#d8cda9"/><rect x="55" y="-7" width="72" height="22" rx="2" fill="#cfb996" fill-opacity=".55"/><text x="21" y="47" fill="#88704d" font-family="sans-serif" font-size="14">Some rough ideas…</text><path d="M23 71h124M23 91h105M23 111h116" stroke="#c9b795" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="134" r="3" fill="#c9b795"/><path d="M40 134h55" stroke="#c9b795" stroke-width="3" stroke-linecap="round"/></g>
<path d="M219 119c49-17 74-4 89 21m-12-4 14 5-2-16" stroke="#81956c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<g transform="translate(149 136) rotate(3 153 113)" filter="url(#shadow)"><rect width="305" height="224" rx="17" fill="#fffefa" stroke="#a6b49a" stroke-width="1.5"/><path d="M0 42h305" stroke="#d9dfd1"/><circle cx="22" cy="22" r="4" fill="#dc8e70"/><circle cx="36" cy="22" r="4" fill="#e4c86f"/><circle cx="50" cy="22" r="4" fill="#9fb18c"/><text x="154" y="26" text-anchor="middle" fill="#87917f" font-family="sans-serif" font-size="11">Teaching illustration</text><rect x="77" y="61" width="206" height="52" rx="11" fill="#eaf0dc"/><text x="93" y="83" fill="#3f5340" font-family="sans-serif" font-size="12">Draft a venue enquiry email</text><text x="93" y="101" fill="#718269" font-family="sans-serif" font-size="9">Polite, concise; do not invent details</text><rect x="19" y="128" width="28" height="28" rx="9" fill="#2e4135"/><path d="M33 134v16M25 142h16M28 137l10 10M28 147l10-10" stroke="#dff27f" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="144" fill="#3f5340" font-family="sans-serif" font-size="13">Let’s make the request clear.</text><path d="M61 162h194M61 177h172M61 192h115" stroke="#d4dacc" stroke-width="5" stroke-linecap="round"/></g>
<g transform="translate(366 280) rotate(-6 85 53)" filter="url(#shadow)"><rect width="168" height="107" rx="12" fill="#fffefa" stroke="#a6b49a"/><circle cx="27" cy="27" r="12" fill="#eaf0dc"/><path d="m21 27 4 4 8-9" stroke="#57734b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="32" fill="#3f5340" font-family="sans-serif" font-size="13">A clear email</text><path d="M20 54h126M20 68h105M20 82h116" stroke="#d4dacc" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(45 294) rotate(-11)"><rect width="122" height="38" rx="19" fill="#f7d1be"/><text x="61" y="25" text-anchor="middle" fill="#784b35" font-family="sans-serif" font-size="13">Start small ↗</text></g>
<path d="M73 239l5 13 14 1-11 9 3 14-12-8-12 7 4-14-10-10 14 1z" fill="#d7b867"/><path d="M502 213v22M491 224h22" stroke="#b8c5a4" stroke-width="3" stroke-linecap="round"/>
<text x="58" y="393" fill="#7a8773" font-family="sans-serif" font-size="11">Notes → Task → Draft → Check</text>
</svg>
